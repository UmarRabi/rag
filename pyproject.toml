[project]
name = "interra-rag"
version = "0.1.0"
description = "Multimodal ingest and retrieval service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.30",
    "boto3>=1.43.114",
    "cryptography>=50.0.2",
    "fastapi>=0.115",
    "fastembed>=0.9.0",
    "filetype>=1.2.0",
    "lingua-language-detector>=2.2.0",
    "onnxruntime>=1.31.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "trafilatura>=2.3.1",
    "uuid-utils>=1.0.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3,sts]",
    "fakeredis>=2.40.0",
    "httpx2>=2.13.1",
    "moto[s3,sts]",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8",
]
media = [
    "av>=19.0.1",
    "faster-whisper>=1.2.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "transformers>=5.20.1",
]
ocr = [
    "rapidocr>=3.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "ASYNC", "RUF", "PL", "PT", "RET", "TID"]
ignore = ["PLR0913"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["N999"]
"tests/**" = ["PLR2004", "PLR0917"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "rapidocr.*", "filetype.*", "pypdfium2.*", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.documents"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not model'"
markers = [
    "integration: requires the local Postgres container",
    "model: loads real ML models; run with -m model",
]
